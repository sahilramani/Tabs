name: Build

# Compile-verifies the iOS app on every push to main and on every PR.
# There is no macOS/Xcode in the authoring environment, so this is the first
# place the project is actually built — it catches SDK/concurrency/API issues
# before they reach a developer's machine.

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Tabs.xcodeproj \
            -scheme Tabs \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}' | head -1)
          xcodebuild test \
            -project Tabs.xcodeproj \
            -scheme Tabs \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
